run:
  timeout: 5m
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - sqlclosecheck
    - depguard
linters-settings:
  depguard:
    rules:
      main:
        deny:
          - pkg: "github.com/pkg/errors"
            desc: "use stdlib errors + fmt.Errorf with %w"
issues:
  exclude-rules:
    - path: _test\.go
      linters: [gosec]
